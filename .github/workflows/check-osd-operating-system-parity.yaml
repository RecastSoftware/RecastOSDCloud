name: Check OSD Operating System Parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/Sync-OSDOperatingSystemParity.ps1'
      - '.github/scripts/osd-operating-system-sync.json'
      - '.github/workflows/check-osd-operating-system-parity.yaml'
      - 'OSDCloud/core/operatingsystems/**'
      - 'OSDCloud/private/core-operatingsystem/**'
      - 'OSDCloud/private/Update-OSDCloudCoreCatalogOS.ps1'

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout RecastOSDCloud
        uses: actions/checkout@v5
        with:
          path: RecastOSDCloud

      - name: Checkout OSD
        uses: actions/checkout@v5
        with:
          repository: OSDeploy/OSD
          path: OSD

      - name: Check operating system parity
        shell: pwsh
        run: |
          & '.\RecastOSDCloud\.github\scripts\Sync-OSDOperatingSystemParity.ps1' `
              -DestinationRepositoryPath '.\OSD' `
              -Check
